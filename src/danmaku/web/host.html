<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Danmaku Host</title>
  <link rel="stylesheet" href="/assets/host.css">
</head>
<body>
  <div id="status" class="status" role="status" aria-live="polite" aria-atomic="true" aria-label="Connection status">
    <span id="service-status" class="status__item">
      <span class="status__dot" aria-hidden="true"></span>
      <span class="status__label" id="service-status-label"></span>
    </span>
    <span id="feed-status" class="status__item">
      <span class="status__dot" aria-hidden="true"></span>
      <span class="status__label" id="feed-status-label"></span>
    </span>
  </div>
  <section id="top-card" class="top-card" hidden aria-label="Top Super Chat presentation">
    <div class="top-card__row">
      <span class="top-card__tier" id="top-tier"></span>
      <span class="top-card__amount" id="top-amount"></span>
      <span class="top-card__user" id="top-user"></span>
      <span class="top-card__pending" id="top-pending"></span>
      <span class="top-card__remaining" id="top-remaining"></span>
    </div>
    <p class="top-card__text" id="top-text"></p>
  </section>
  <main id="timeline" aria-label="Host message timeline"></main>
  <button id="clear" class="control control--clear" type="button" aria-label="Clear host timeline">Clear</button>
  <button id="new-messages" class="control control--new-messages" type="button" hidden aria-label="Return to latest messages">New messages</button>
  <button id="skip" class="control control--skip" type="button" aria-label="Skip Super Chat presentation">Skip</button>
  <button id="settings-toggle" class="control control--settings" type="button" aria-expanded="false" aria-controls="settings-panel" aria-label="Open host settings">Settings</button>
  <section id="settings-panel" class="settings" hidden aria-label="Host settings">
    <form id="settings-form" class="settings__form">
      <header class="settings__header">
        <h2 class="settings__title">Settings</h2>
        <p class="settings__subtitle">Changes are saved for the next start; a restart is required to apply them.</p>
      </header>

      <div class="settings__field">
        <label class="settings__label" for="settings-host">Service host</label>
        <input class="settings__input" id="settings-host" type="text" value="127.0.0.1" disabled>
        <p class="settings__hint">Fixed loopback address.</p>
      </div>

      <div class="settings__field">
        <label class="settings__label" for="settings-port">Service port</label>
        <input class="settings__input" id="settings-port" type="number" min="1024" max="65535" step="1" required>
      </div>

      <div class="settings__field">
        <label class="settings__label" for="settings-cadence">Mock cadence (milliseconds)</label>
        <input class="settings__input" id="settings-cadence" type="number" min="100" max="60000" step="1" required>
      </div>

      <div class="settings__field">
        <label class="settings__label" for="settings-max-messages">Snapshot max messages</label>
        <input class="settings__input" id="settings-max-messages" type="text" value="100" disabled>
        <p class="settings__hint">Fixed protocol and DOM cap.</p>
      </div>

      <div class="settings__field">
        <label class="settings__label" for="settings-deny-user-ids">Denied user IDs (one per line)</label>
        <textarea class="settings__input settings__input--list" id="settings-deny-user-ids" rows="3"></textarea>
      </div>

      <div class="settings__field">
        <label class="settings__label" for="settings-deny-nicknames">Denied nicknames (one per line)</label>
        <textarea class="settings__input settings__input--list" id="settings-deny-nicknames" rows="3"></textarea>
      </div>

      <div class="settings__field">
        <label class="settings__label" for="settings-keywords">Denied keywords (one per line)</label>
        <textarea class="settings__input settings__input--list" id="settings-keywords" rows="3"></textarea>
      </div>

      <div class="settings__field">
        <label class="settings__label" for="settings-gift-threshold">Ordinary gift threshold (milli-CNY)</label>
        <input class="settings__input" id="settings-gift-threshold" type="number" min="0" step="1" required>
      </div>

      <p id="settings-feedback" class="settings__feedback" role="status" aria-live="polite"></p>

      <div class="settings__actions">
        <button class="settings__button settings__button--primary" id="settings-save" type="submit">Save</button>
        <button class="settings__button" id="settings-close" type="button">Close</button>
      </div>
    </form>
  </section>
  <p id="action-feedback" class="action-feedback" role="status" aria-live="polite" aria-atomic="true" hidden></p>
  <script src="/assets/host.js"></script>
</body>
</html>
