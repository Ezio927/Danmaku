[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "danmaku"
version = "0.1.0"
description = "Danmaku first vertical slice: loopback-only HTTP/WebSocket service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp==3.14.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
danmaku = ["web/index.html", "web/app.js", "web/style.css"]
